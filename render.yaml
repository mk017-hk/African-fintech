# Render blueprint — one-click deploy.
#
# Steps:
#   1. Push this repo to GitHub.
#   2. https://dashboard.render.com → New → Blueprint → connect this repo.
#   3. Render reads this file, provisions Postgres + Redis, builds the image,
#      runs the Prisma migration on startup, and exposes the web URL.
#   4. Once it's "Live", open the URL and sign in as
#         alice@demo.test / AlicePass_999!
#      (the dev seed runs only when NODE_ENV !== production, so for the
#      first prod deploy you'll need to log into Render's shell and run
#      `pnpm db:seed:dev` once if you want the test users — or skip the
#      seed and sign up real users.)
#
# Secrets are generated by Render at create time. Save them somewhere safe
# the moment the service is live; losing PII_ENCRYPTION_KEY is unrecoverable.

services:
  - type: web
    name: afristable-pay
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/docker/all-in-one.Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase: { name: afristable-db, property: connectionString }
      - key: REDIS_URL
        fromService:  { name: afristable-redis, type: keyvalue, property: connectionString }
      - key: JWT_ACCESS_SECRET      ; generateValue: true
      - key: JWT_REFRESH_SECRET     ; generateValue: true
      - key: QUOTE_SIGNING_KEY      ; generateValue: true
      - key: WEBHOOK_SIGNING_SECRET ; generateValue: true
      - key: PII_ENCRYPTION_KEY     ; generateValue: true
      - key: API_PUBLIC_URL         ; fromService: { name: afristable-pay, type: web, property: host }
      - key: WEB_PUBLIC_URL         ; fromService: { name: afristable-pay, type: web, property: host }
      - key: CORS_ORIGINS           ; fromService: { name: afristable-pay, type: web, property: host }
      - key: WEBAUTHN_ORIGIN        ; fromService: { name: afristable-pay, type: web, property: host }
      - key: WEBAUTHN_RP_ID         ; fromService: { name: afristable-pay, type: web, property: host }

  - type: keyvalue
    name: afristable-redis
    plan: free
    ipAllowList: []

databases:
  - name: afristable-db
    plan: free
    postgresMajorVersion: 16
